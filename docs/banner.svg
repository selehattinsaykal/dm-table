<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="DM Table — Dungeon Master's table, in sync.">
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17120f"/>
      <stop offset="55%" stop-color="#0f0c0a"/>
      <stop offset="100%" stop-color="#080605"/>
    </linearGradient>
    <radialGradient id="ember" cx="50%" cy="112%" r="72%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#7c2d12" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5e0b0"/>
      <stop offset="45%" stop-color="#d9b46a"/>
      <stop offset="100%" stop-color="#a67c3d"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a67c3d" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d9b46a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a67c3d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#stone)"/>
  <rect width="1200" height="320" fill="url(#ember)"/>
  <rect x="18" y="18" width="1164" height="284" fill="none" stroke="#d9b46a" stroke-opacity="0.28" stroke-width="1.5"/>
  <rect x="26" y="26" width="1148" height="268" fill="none" stroke="#d9b46a" stroke-opacity="0.12" stroke-width="1"/>

  <!-- corner flourishes -->
  <g stroke="#d9b46a" stroke-opacity="0.45" stroke-width="1.5" fill="none">
    <path d="M18 60 L18 18 L60 18"/>
    <path d="M1140 18 L1182 18 L1182 60"/>
    <path d="M18 260 L18 302 L60 302"/>
    <path d="M1140 302 L1182 302 L1182 260"/>
  </g>

  <!-- d20 sigil -->
  <g transform="translate(150 160)">
    <circle r="72" fill="#100c09" stroke="#d9b46a" stroke-opacity="0.30" stroke-width="1"/>
    <g fill="none" stroke="url(#gold)" stroke-width="2.2" stroke-linejoin="round">
      <polygon points="0,-58 50,-29 50,29 0,58 -50,29 -50,-29"/>
      <polygon points="0,-30 26,15 -26,15"/>
      <path d="M0,-58 L0,-30 M50,-29 L26,15 M-50,-29 L-26,15"/>
      <path d="M0,58 L-26,15 M0,58 L26,15 M50,29 L26,15 M-50,29 L-26,15"/>
    </g>
    <circle r="5" fill="#e0723a"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(268 0)">
    <text x="0" y="150" font-family="Cinzel, Trajan Pro, Georgia, 'Times New Roman', serif"
          font-size="82" letter-spacing="14" fill="url(#gold)">DM TABLE</text>
    <rect x="4" y="176" width="640" height="2" fill="url(#rule)"/>
    <text x="6" y="216" font-family="Georgia, 'Times New Roman', serif" font-size="26"
          letter-spacing="2" fill="#e8dcc6" fill-opacity="0.88">The Dungeon Master's table, in sync.</text>
    <text x="6" y="256" font-family="Consolas, 'SF Mono', monospace" font-size="17"
          letter-spacing="1.5" fill="#d9b46a" fill-opacity="0.72">Flutter · Windows + Android · LAN player panel · D&amp;D 2024 SRD 5.2</text>
  </g>
</svg>
