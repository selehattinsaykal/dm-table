org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin artimli derleme KAPALI.
#
# Flutter tum eklentilerin Kotlin onbellegini projenin ortak `build/`
# klasorunun altina yaziyor. Windows'ta bu klasor ayni anda hem Gradle
# daemon'i hem arka plan dosya tarayicilari tarafindan tutulunca derleme
# "Could not close incremental caches ... class-fq-name-to-source.tab" ile
# dusuyor. Eklentiler zaten her temiz surumde bastan derlendigi icin
# artimli derlemenin kazandirdigi da yok.
kotlin.incremental=false
