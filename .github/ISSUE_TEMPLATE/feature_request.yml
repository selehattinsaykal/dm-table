name: Feature request
description: Suggest something the table needs
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve at the table?
      description: Describe the situation during play, not just the feature.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true

  - type: checkboxes
    id: content
    attributes:
      label: Content policy
      options:
        - label: >
            This request does not require shipping additional copyrighted rules text, stat blocks or
            art with the app.
          required: true
