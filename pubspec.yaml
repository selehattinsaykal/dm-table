name: dm_table
description: "DM Table — LAN-synced Dungeon Master toolkit for D&D 2024 (SRD 5.2): campaign management, combat tracker and a live player web panel."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.0+2

environment:
  sdk: ^3.10.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  # drift_flutter, sqlite3_flutter_libs'in (EOL) yerini alir; native kutuphaneyi
  # sqlite3 3.x hook'lari uzerinden kendisi paketler.
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  collection: ^1.19.1
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  shelf_static: ^1.1.3
  web_socket_channel: ^3.0.3
  qr_flutter: ^4.1.0
  network_info_plus: ^8.2.1
  file_selector: ^1.1.0
  image_picker: ^1.2.3
  image: ^4.8.0
  intl: 0.20.2 # flutter_localizations tarafindan sabitlendi
  shared_preferences: ^2.5.5
  web: ^1.1.1
  # Saf Dart; yerel eklenti degil. Yedek arsivi icin.
  archive: ^4.0.9
  # Kayitlar (Codex) taverna AI ureteci: opt-in, kullanicinin kendi anahtariyla
  # (Gemini/OpenAI/Claude). Anahtar cihazda saklanir, LAN'a girmez.
  http: ^1.6.0
  # Kayitlar (Codex) harici link blogu: URL'yi sistem tarayicisinda acar.
  url_launcher: ^6.3.1
  # Kayitlar (Codex) video blogu: uygulama ici oynatma. video_player Windows'u
  # desteklemedigi icin media_kit (Windows + Android + hepsi) secildi.
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # 2.34.1+1 ve ustu analyzer ^13 istiyor; bu da flutter_test'in test_api pini
  # uzerinden web_socket_channel'i 3.x'in altina zorluyor. LAN sunucusu icin
  # shelf_web_socket 3.x gerektiginden drift_dev burada sabitlendi.
  drift_dev: 2.34.0
  build_runner: ^2.15.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true

  assets:
    # CC-BY 4.0 / OGL icerik (tools/fetch_open5e.dart uretir)
    - assets/data/
    # Baslik fontu (Cinzel, OFL 1.1)
    - assets/fonts/
    # Elle yazilan 2024 sinif ilerleme tablolari
    - assets/rules/
    # Uygulama logosu (1024x1024 kaynaktan tum platform ikonlari uretilecek)
    - assets/logo/logo.png
    # Oyuncu paneli web derlemesi; DM cihazi LAN uzerinden servis eder.
    # Flutter asset dizinlerini ic ice taramadigi icin her alt klasor tek tek
    # yazilmali; asagidaki blok elle duzenlenmez, derleme araci uretir:
    #   dart run tools/build_player_web.dart
    # >>> player_web
    - assets/player_web/
    - assets/player_web/assets/
    - assets/player_web/assets/assets/
    - assets/player_web/assets/assets/data/
    - assets/player_web/assets/assets/fonts/
    - assets/player_web/assets/assets/logo/
    - assets/player_web/assets/assets/rules/
    - assets/player_web/assets/fonts/
    - assets/player_web/assets/packages/
    - assets/player_web/assets/packages/cupertino_icons/
    - assets/player_web/assets/packages/cupertino_icons/assets/
    - assets/player_web/assets/shaders/
    - assets/player_web/canvaskit/
    - assets/player_web/canvaskit/chromium/
    - assets/player_web/icons/
    # <<< player_web

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Basliklarda kullanilan orta cag/fantastik serif. Cinzel (SIL Open Font
  # License 1.1) — degisken font (wght ekseni), tek dosya tum agirliklari verir.
  # Govde metni sistemin sans fontunda kalir (modern + okunur); bkz. app/theme.dart
  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel.ttf
    # Uzun okuma yuzeyleri (Codex govdesi, lore, stat blogu) icin el yazmasi
    # serifi. EB Garamond (SIL OFL 1.1) — degisken font (wght ekseni).
    # Yogun form/liste UI'i sans'ta kalir; bkz. app/theme.dart readingStyle().
    #
    # Latin + Turkce + tipografik isaretlere ALTKUMELENDI (pyftsubset):
    # 851 KB -> 186 KB. Oyuncu paneli LAN uzerinden indirildigi icin her MB
    # onemli. Kapsam disi bir alfabe gerekirse (orn. Yunanca/Kiril) fontu
    # google/fonts deposundan yeniden altkumele.
    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond.ttf
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# NOT: Ikonlar `logo.png`'den DEGIL `logo_icon.png`'den uretiliyor. Kaynak
# logonun 1024'luk tuvalinde genis bos kenar payi var (icerik yalnizca
# 614x778); dogrudan ikona cevrilince gorev cubugunda kucuk duruyordu.
# `logo_icon.png` ayni logonun icerige kirpilip tuvalin %92'sine oturtulmus
# hali. Logo degisirse `tools/build_icon.dart` ile yeniden uret.
flutter_launcher_icons:
  image_path: "assets/logo/logo_icon.png"
  # android: true  # iOS projesinin yok; build hata veriyor.
  # ios: true
  windows:
    generate: true
    image_path: "assets/logo/logo_icon.png"
  web:
    generate: true
    image_path: "assets/logo/logo_icon.png"
    background_color: "#0d0d0d"
    theme_color: "#0d0d0d"